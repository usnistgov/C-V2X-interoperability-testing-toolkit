# Demo configuration: simulated devices only (no SSH needed).
# rsu1 captures two streams, which are merged into rsu1.pcap.

default_duration = 10

[[devices]]
name = "obu1"
model = "mock"
role = "obu"

[devices.options]
packet_rate_hz = 10.0

[[devices]]
name = "obu2"
model = "mock"
role = "obu"

[devices.options]
packet_rate_hz = 20.0
clock_offset_ms = 400

[[devices]]
name = "rsu1"
model = "mock"
role = "rsu"

[devices.options]
packet_rate_hz = 5.0
streams = 2
