# Test configuration: 25 simulated devices, 18 OBUs and 7 RSUs (no SSH needed).
# The clock offsets of obu12 and rsu6 are above the clock skew warning threshold.
# obu5, rsu2 and rsu3 capture two streams each, and rsu4 four.

default_duration = 30

[[devices]]
name = "obu1"
model = "mock"
role = "obu"

[devices.options]
packet_rate_hz = 10.0
step_delay_ms = 100

[[devices]]
name = "obu2"
model = "mock"
role = "obu"

[devices.options]
packet_rate_hz = 12.0
clock_offset_ms = 80
step_delay_ms = 250

[[devices]]
name = "obu3"
model = "mock"
role = "obu"

[devices.options]
